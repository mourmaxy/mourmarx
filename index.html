<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد</title>
    <style>
        /* إعدادات التصميم الحديث المظلم */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0a0a0a; /* أسود داكن حديث */
            color: #ffffff; /* نصوص بيضاء */
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 80px 20px;
        }

        /* حاوية ممتدة وأنيقة */
        .signup-container {
            max-width: 550px;
            width: 100%;
        }

        .signup-container h2 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        .signup-container p {
            color: #888888; /* رمادي خفيف للمظهر الحديث */
            font-size: 1rem;
            margin-bottom: 40px;
        }

        /* تنسيق الحقول الحديثة */
        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 500;
            font-size: 0.9rem;
            color: #cccccc;
        }

        .input-group input[type="text"],
        .input-group input[type="email"],
        .input-group input[type="password"],
        .input-group input[type="date"] {
            width: 100%;
            padding: 16px;
            border: 1px solid #222222; /* إطار داكن مدمج */
            background-color: #121212; /* خلفية الحقل أسود خفيف */
            color: #ffffff;
            font-size: 0.95rem;
            border-radius: 8px; /* حواف دائرية ناعمة */
            outline: none;
            transition: all 0.3s ease;
        }

        /* تأثير التوهج الأبيض الحديث عند التركيز */
        .input-group input:focus {
            border-color: #ffffff;
            background-color: #161616;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
        }

        /* خيارات الجنس */
        .gender-options {
            display: flex;
            gap: 30px;
            margin-top: 10px;
        }

        .gender-options label {
            font-weight: normal;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
        }

        .gender-options input[type="radio"] {
            accent-color: #ffffff; /* خيار الراديو باللون الأبيض */
            width: 18px;
            height: 18px;
        }

        /* زر التسجيل الأبيض المتطور */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            letter-spacing: 0.5px;
        }

        .btn-submit:hover {
            background-color: #e5e5e5;
            transform: translateY(-2px); /* تأثير ارتفاع بسيط وجذاب */
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
        }

        .btn-submit:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <h2>إنشاء حساب جديد</h2>
        <p>انضم إلى مجتمعنا وتواصل مع أصدقائك.</p>
        
        <form action="#" method="POST">
            <div class="input-group">
                <label for="fullname">الاسم الكامل</label>
                <input type="text" id="fullname" name="fullname" placeholder="أدخل اسمك الثلاثي" required>
            </div>

            <div class="input-group">
                <label for="username">اسم المستخدم (Username)</label>
                <input type="text" id="username" name="username" placeholder="مثال: ahmad_99" required>
            </div>

            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" name="password" placeholder="أدخل كلمة مرور قوية" required>
            </div>

            <div class="input-group">
                <label for="dob">تاريخ الميلاد</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <div class="input-group">
                <label>الجنس</label>
                <div class="gender-options">
                    <label><input type="radio" name="gender" value="male" required> ذكر</label>
                    <label><input type="radio" name="gender" value="female" required> أنثى</label>
                </div>
            </div>

            <button type="submit" class="btn-submit">تسجيل الحساب</button>
        </form>
    </div>

</body>
</html>
